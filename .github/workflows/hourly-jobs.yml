name: Scheduled jobs

# Vercel Hobby only runs crons once a day, so these are triggered from here.
# Requires repository secrets APP_URL (e.g. https://devtrack.example.com) and CRON_SECRET.
#
# Every run is a function invocation billed as Vercel Active CPU, so jobs run
# only as often as their data changes:
# - goals-sync: every 6 hours. Goal progress also refreshes when a user
#   presses Sync on the dashboard.
# - notifications/weekly: once a day. It skips anyone sent in the last 7 days,
#   so running it hourly only re-checked the same users 23 extra times.
on:
  schedule:
    - cron: "5 0 * * *"
    - cron: "5 6,12,18 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: hourly-jobs
  cancel-in-progress: false

jobs:
  trigger:
    if: github.repository == 'Priyanshu-byte-coder/devtrack'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - path: /api/cron/goals-sync
            daily_only: false
          - path: /api/notifications/weekly
            daily_only: true
    steps:
      - name: Call ${{ matrix.path }}
        if: ${{ !matrix.daily_only || github.event_name != 'schedule' || github.event.schedule == '5 0 * * *' }}
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::APP_URL or CRON_SECRET is not configured; skipping."
            exit 0
          fi
          status=$(curl -sS -o response.json -w '%{http_code}' --max-time 310 \
            -H "Authorization: Bearer $CRON_SECRET" "${APP_URL%/}${{ matrix.path }}")
          echo "HTTP $status"
          head -c 500 response.json; echo
          test "$status" -lt 400
