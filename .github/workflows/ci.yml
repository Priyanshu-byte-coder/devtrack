name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Default to read-only; jobs that need more raise it themselves.
permissions:
  contents: read

# Cancel outdated runs on the same PR/branch to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@11.13.1 --activate
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tsc
        run: pnpm run type-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@11.13.1 --activate
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

  test-coverage:
    name: Test coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@11.13.1 --activate
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest with coverage
        id: coverage
        run: pnpm run test:coverage

      - name: Verify Node and database regression suites
        run: pnpm run test:node && pnpm run test:db

      - name: Enforce baseline line coverage
        run: node scripts/check-coverage.cjs

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: unit-coverage
          path: coverage
          retention-days: 14

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Dummy values: API routes are force-dynamic and only run at request time.
      NEXTAUTH_SECRET: ci-placeholder-secret-that-is-long-enough-32c
      NEXTAUTH_URL: http://localhost:3000
      GITHUB_ID: ci-placeholder
      GITHUB_SECRET: ci-placeholder
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
      SUPABASE_SERVICE_ROLE_KEY: placeholder-service-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@11.13.1 --activate
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Next.js app
        run: pnpm run build

  dep-check:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@11.13.1 --activate
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check API specification
        run: pnpm run api:check

      - name: Production vulnerability audit
        run: pnpm run security:audit

      - name: Check all imports exist in package.json
        run: node scripts/check-deps.js

  env-security:
    name: Environment security check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check SERVICE_ROLE_KEY exposure
        run: bash scripts/check-env-security.sh

  ci-pass:
    name: CI passed
    runs-on: ubuntu-latest
    needs: [typecheck, lint, build, dep-check, env-security, test-coverage]
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.typecheck.result }}" != "success" ||
                "${{ needs.lint.result }}" != "success" ||
                "${{ needs.build.result }}" != "success" ||
                "${{ needs.dep-check.result }}" != "success" ||
                "${{ needs.env-security.result }}" != "success" ||
                "${{ needs.test-coverage.result }}" != "success" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
