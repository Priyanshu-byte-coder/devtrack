name: Automated Testing Suite & CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate-and-test:
    name: Continuous Integration Security & Audit Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code Repository Layers
        uses: actions/checkout@v7

      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@11.13.1 --activate

      - name: Initialize Node.js Environment
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Project Dependencies (Clean Architecture Ingest)
        run: pnpm install --frozen-lockfile

      - name: Run Automated Unit Testing Framework Suites
        run: pnpm run test:node && pnpm run test:db

      - name: Run environment and dependency security checks
        run: pnpm run security:env && pnpm run security:audit
