name: Feature request
description: Suggest something new for DevTrack
title: "[FEAT] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please search [open and closed issues](https://github.com/Priyanshu-byte-coder/devtrack/issues?q=is%3Aissue) first. For a big or open-ended idea, start a thread in [Ideas](https://github.com/Priyanshu-byte-coder/devtrack/discussions/categories/ideas) to gather feedback before it becomes an issue.

  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Who is it for and what can't they do today?
      placeholder: As a developer comparing myself with friends, I can't see who improved the most this month.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What should it do?
      description: Describe how it would work. Sketches or screenshots of similar features help.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Dashboard overview
        - Repositories
        - Pull requests and reviews
        - Goals
        - Streak and activity
        - AI features (insights, personality, project tutor, career)
        - Public profile or share card
        - Leaderboard or Top boards
        - Compare (duels)
        - README badges
        - Weekly email
        - Settings and privacy
        - Translations
        - Landing page or guides
        - API
        - Something new
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: How will we know it's done?
      value: |
        - [ ] …
        - [ ] …
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: Alternatives you considered, edge cases, related issues.
    validations:
      required: false

  - type: checkboxes
    id: contribute
    attributes:
      label: Want to build it?
      options:
        - label: I'd like to work on this. A maintainer will confirm the scope and assign you; please don't start before that.
