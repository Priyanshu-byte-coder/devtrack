name: Tests
description: Add or improve tests for a specific module
title: "test: "
labels: ["type:testing", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        One issue per module, please. Search [open and closed issues](https://github.com/Priyanshu-byte-coder/devtrack/issues?q=is%3Aissue+test) for the file name first; duplicate test issues are closed automatically.

  - type: input
    id: module
    attributes:
      label: Source file
      placeholder: src/lib/goals-sync.ts
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: What's covered today?
      description: Is there already a test file? What does it miss?
      placeholder: No test file imports goals-sync.ts.
    validations:
      required: true

  - type: textarea
    id: cases
    attributes:
      label: Cases to test
      description: Behaviour that matters (edge cases, failures), not one test per line of code.
      placeholder: |
        - a goal that reaches its target is marked complete once
        - a GitHub error doesn't wipe existing progress
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Want to write them?
      options:
        - label: I'd like to work on this. A maintainer will assign you; please don't start before that.
