openapi: 3.1.0
info:
  title: DevTrack API
  description: REST API for DevTrack - an open-source developer productivity dashboard
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Local development server
  - url: https://devtrack.vercel.app
    description: Production server
security:
  - cookieAuth: []
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: next-auth.session-token
      description: >-
        HttpOnly NextAuth cookie; HTTPS uses the __Secure- prefix. Provider tokens are never returned to
        browser clients.
    cronAuth:
      type: http
      scheme: bearer
      description: CRON_SECRET supplied by the scheduler; all environments enforce it.
    localCodingKey:
      type: http
      scheme: bearer
      description: Personal DevTrack local coding API key.
    leaderboardRebuild:
      type: apiKey
      in: header
      name: x-devtrack-rebuild-token
      description: LEADERBOARD_REBUILD_TOKEN supplied by a trusted operator.
    githubWebhook:
      type: apiKey
      in: header
      name: x-hub-signature-256
      description: HMAC SHA-256 of the raw request body using GITHUB_WEBHOOK_SECRET.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
    Goal:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        target:
          type: integer
        current:
          type: integer
        unit:
          type: string
        repo:
          type:
            - string
            - 'null'
        recurrence:
          type: string
          enum:
            - none
            - weekly
            - monthly
        created_at:
          type: string
          format: date-time
    Streak:
      type: object
      properties:
        current:
          type: integer
        longest:
          type: integer
        lastCommitDate:
          type:
            - string
            - 'null'
        totalActiveDays:
          type: integer
        complete:
          type: boolean
          description: False when the requested commit history could not be fully collected.
